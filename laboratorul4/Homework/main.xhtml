<ui:composition template="/WEB-INF/templates/dataView.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">


   <ui:define name="dataViewContent">
      <!-- Display data as a list -->
      <h:outputText value="Product List:" />
      <ul>
         <ui:repeat value="#{productView.products}" var="product">
            <li><h:outputText value="#{product.name}" /></li>
         </ui:repeat>
      </ul>
   </ui:define>


</ui:composition>
