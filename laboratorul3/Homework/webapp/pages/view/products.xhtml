<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://java.sun.com/jsf/core">

<h:head>
    <title>#{msg['product.list']}</title>
</h:head>

<h:body>

    <h:form>
        <h:selectOneMenu value="#{localeSwitcher.currentLocale}" onchange="this.form.submit()">
            <f:selectItem itemValue="en" itemLabel="English" />
            <f:selectItem itemValue="fr" itemLabel="French" />
            <f:ajax listener="#{localeSwitcher.changeLocale(value)}" render="@all"/>
        </h:selectOneMenu>
    </h:form>

    <h1>#{msg['product.list']}</h1>

    <h:form>
        <h:commandButton value="Edit Users" action="#{userView.editUsers}" />
    </h:form>

    <p:dataTable value="#{productView.products}" var="product" paginator="true" rows="5">
        <p:column headerText="ID">
            <h:outputText value="#{product.id}" />
        </p:column>

        <p:column headerText="Name">
            <h:outputText value="#{product.name}" />
        </p:column>

        <p:column headerText="Description">
            <h:outputText value="#{product.description}" />
        </p:column>

        <p:column headerText="Price">
            <h:outputText value="#{product.price}" />
        </p:column>

        <p:column headerText="Quantity">
            <h:outputText value="#{product.quantity}" />
        </p:column>

        <p:column headerText="Category">
            <h:outputText value="#{product.category}" />
        </p:column>
    </p:dataTable>
</h:body>
</html>
