<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login Page</title>
    <link type="text/css" rel="stylesheet" href="index.css" />
</h:head>

<h:body>
    <div id="header" class="p-d-block">
        <ui:insert name="header">
            <ui:include src="/WEB-INF/decorators/header.xhtml" />
        </ui:insert>
    </div>


    <h:form styleClass="form-class">
        <h1>Login</h1>


        <!-- Input pentru username -->
        <h:outputLabel for="username" value="Username:" />
        <br/>
        <p:inputText id="username" value="#{authBean.username}" required="true"
                     requiredMessage="Trebuie să introduceți un username."
                     styleClass="input-field" />

        <br/>

        <!-- Input pentru parolă -->
        <h:outputLabel for="password" value="Password:" />
        <br/>
        <p:password id="password" value="#{authBean.password}" required="true"
                    requiredMessage="Trebuie să introduceți o parolă."
                    styleClass="input-field" />

        <br/>

        <!-- Buton de login -->
        <p:commandButton value="Login" action="#{authBean.login}" update="messages"/>

        <h:messages id="messages" showDetail="true" showSummary="false"
                    infoClass="custom-info" errorClass="custom-error" />

    </h:form>

</h:body>
</html>
