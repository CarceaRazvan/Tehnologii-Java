<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <div id="menuBar">

        <div class="card">
            <h:form>
                <p:growl id="messages" />

                <p:toolbar style="width: 100%;">
                    <!-- Left side: Menu bar -->
                    <p:toolbarGroup align="left">
                        <p:menubar hideDelay="1000">

                            <!-- Meniu pentru utilizatori neconectați -->
                                <p:submenu label="Conectare" icon="pi pi-fw pi-user">
                                    <p:menuitem value="Logare" outcome="login" icon="pi pi-fw pi-user" />
                                    <p:menuitem value="Înregistrare" outcome="register" icon="pi pi-fw pi-user-plus" />
                                </p:submenu>

                            <!-- Meniu pentru utilizatori conectați -->
                                <p:submenu label="Utilizator" icon="pi pi-fw pi-user">
                                    <p:menuitem value="Profil" outcome="profile" icon="pi pi-fw pi-id-card" />
                                    <p:menuitem value="Deconectare" action="#{authBean.logout}" icon="pi pi-fw pi-sign-out" />
                                </p:submenu>

                            <p:menuitem value="Evaluate Teacher" outcome="evaluate" icon="pi pi-fw pi-file-plus" />
                            <p:menuitem value="Evaluations submited" outcome="view-evaluations" icon="pi pi-fw pi-file" />

                        </p:menubar>
                    </p:toolbarGroup>

                    <!-- Right side: Title -->
                    <p:toolbarGroup align="right">
                        <h:outputText value="Laboratorul 7" style="font-size: 16px; font-weight: bold; color: #333;" />
                    </p:toolbarGroup>
                </p:toolbar>
            </h:form>
        </div>
    </div>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            // Verifică dacă există un token JWT în localStorage
            var token = localStorage.getItem('jwt_auth');

            // Verifică dacă token-ul există
            if (token) {
                // Modifică meniul pentru utilizatori conectați

                console.log("true");
            } else {
                // Modifică meniul pentru utilizatori neconectați

                console.log("false");

            }
        });

    </script>
</f:view>
</html>
