<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
   <title>Orders List</title>
</h:head>
<h:body>
   <div id="header" class="p-d-block">
      <ui:insert name="header">
         <ui:include src="/WEB-INF/decorators/header.xhtml" />
      </ui:insert>
   </div>

   <h:form id="orderForm">
      <h2>Client Orders</h2>

      <p:dataTable value="#{cache.orders.entrySet()}" var="entry" styleClass="table">
         <p:column headerText="Order ID">
            <h:outputText value="#{entry.key}" />
         </p:column>

         <p:column headerText="Client ID">
            <h:outputText value="#{entry.value.user.id}" />
         </p:column>

         <p:column headerText="Order Items">
            <!-- Use retrieveOrderItems with the order ID to get items dynamically -->
            <p:dataTable value="#{cache.retrieveOrderItems(entry.value.id)}" var="item" style="width:100%">
               <p:column headerText="Product Name">
                  <h:outputText value="#{item.product.name}" />
               </p:column>
               <p:column headerText="Quantity">
                  <h:outputText value="#{item.quantity}" />
               </p:column>
            </p:dataTable>
         </p:column>
      </p:dataTable>
   </h:form>

</h:body>
</html>
