<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login Page</title>
    <link type="text/css" rel="stylesheet" href="#{request.contextPath}/css/index.css" />

</h:head>
<h:body>
    <div id="header" class="p-d-block">
        <ui:insert name="header">
            <ui:include src="/WEB-INF/decorators/header.xhtml" />
        </ui:insert>
    </div>

    <h:form id="login"
            onsubmit="document.getElementById('login').action='j_security_check';" prependId="false" styleClass="form-class">
        <h1>Login</h1>

        <h:outputLabel value="Username:" />
        <br/>
        <p:inputText id="j_username" name="j_username" value="#{authBean.username}" required="true"
                     requiredMessage="Trebuie să introduceți un username."
                     styleClass="input-field" />
        <br/>
        <h:outputLabel value="Password:" />
        <br/>
        <p:inputText id="j_password" name="j_password" value="#{authBean.password}" type="password" required="true"
                     requiredMessage="Trebuie să introduceți o parolă."
                     styleClass="input-field" />
        <br/>
        <p:commandButton value="Login" action="#{authBean.login()}" update="messages" />
        <h:messages id="messages" showDetail="true" showSummary="false"
                    infoClass="custom-info" errorClass="custom-error" />

        <!--        <h:panelGrid columns="2">-->
<!--            <h:outputLabel value="Username: " />-->
<!--            <h:inputText id="j_username" name="j_username" />-->
<!--            <h:outputLabel value="Password: " />-->
<!--            <h:inputText id="j_password" name="j_password" />-->
<!--        </h:panelGrid>-->
<!--        <h:commandButton value="Login" />-->
    </h:form>
</h:body>
</html>
